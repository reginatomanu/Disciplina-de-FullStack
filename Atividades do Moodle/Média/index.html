<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Registro de Notas</h1>

        <form id="formulario">

            <label for="nome">Nome do aluno:</label>
            <input type="text" id="nome" required>

            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1" class="nota">

            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1" class="nota">

            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" min="0" max="10" step="0.1" class="nota">

            <label for="nota4">Nota 4:</label>
            <input type="number" id="nota4" min="0" max="10" step="0.1" class="nota">

            <p id="media">Média: -</p>

            <button type="submit">Registrar resultado</button>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
